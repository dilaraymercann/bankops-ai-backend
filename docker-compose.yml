# Lokal geliştirme veritabanı: PostgreSQL 18 + pgvector eklentisi.
# Şifre .env dosyasından okunur (.env.example dosyasını kopyalayarak oluştur).
services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg18
    container_name: bankops-postgres
    environment:
      POSTGRES_DB: bankops
      POSTGRES_USER: bankops
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD .env dosyasında tanımlı olmalı}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bankops -d bankops"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
