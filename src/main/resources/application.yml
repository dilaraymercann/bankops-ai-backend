spring:
  application:
    name: bankops-backend
  config:
    # Lokal geliştirmede gizli değerler proje kökündeki .env dosyasından okunur.
    # Dosya yoksa (CI, testler) bu adım atlanır ve ortam değişkenleri kullanılır.
    import: optional:file:.env[.properties]
  datasource:
    # Varsayılanlar lokal docker compose içindir; yayında (Render) ortam değişkenleriyle ezilir.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/bankops}
    username: ${DB_USERNAME:bankops}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate      # Şemayı Flyway yönetir, Hibernate sadece doğrular
    open-in-view: false
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html

bankops:
  sla:
    business-hours-start: "08:30"
    business-hours-end: "17:30"
    time-zone: Europe/Istanbul
    check-interval: 60000     # milisaniye (SLA kontrol job'u Faz 3'te eklenecek)
  jwt:
    issuer: BankOps
    expiry-minutes: 480
    secret: ${JWT_SECRET}      # en az 32 karakter; ortam değişkeninden okunur
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  ai:
    similarity-threshold: 0.80
    max-references: 5
    cache-hours: 24
    user-limit-per-minute: 6      # kullanıcı başına AI analiz isteği (önbellekten dönenler sayılmaz)
    global-limit-per-minute: 30   # tüm kullanıcılar toplamı; ücretsiz API kotasını korur
    gemini:
      api-key: ${GEMINI_API_KEY:}   # boşsa AI özellikleri kapalıdır, uygulama yine çalışır
      base-url: https://generativelanguage.googleapis.com/v1beta
      # Sırayla denenir: yoğunluk (503/429) olursa bir sonraki modele geçilir
      chat-models: gemini-3.6-flash,gemini-3.5-flash,gemini-3.5-flash-lite
      embedding-model: gemini-embedding-2
      embedding-dimensions: 768
