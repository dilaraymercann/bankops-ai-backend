# Yalnızca testler için: gerçek bir sır değildir.
bankops.jwt.secret=test-only-jwt-secret-not-for-production-0123456789
# SLA eskalasyon job'u testlerde kendiliğinden çalışmasın; testler servisi doğrudan çağırır
bankops.sla.check-interval=3600000
# AI testleri sahte (fake) embedding/LLM kullanır; kelime torbası benzerliği gerçek modelden düşük olduğu için eşik düşürülür
bankops.ai.similarity-threshold=0.2
bankops.ai.user-limit-per-minute=1000
bankops.ai.global-limit-per-minute=1000
